# Builds and uploads the site to Cloudflare Pages on every push to main.
#
# This exists because pushes to main stopped producing deployments and the
# dashboard's git integration is the only thing that can explain why. A workflow
# here does not depend on it: it builds the same `npm run build` output the
# dashboard would and uploads it with wrangler.
#
# It needs two repository secrets (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   the account id from any dashboard URL
#
# Without them the build still runs and the upload is skipped with an
# explanation, so the workflow never fails just for being unconfigured.
#
# One caveat: Cloudflare refuses direct uploads to a Pages project that is
# connected to a Git repository. If the upload step reports that, the project is
# still git-connected — which also means the integration is present but not
# firing, and the fix belongs in the dashboard rather than here.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Runs the same prebuild → gpx:stats → typecheck → vite build chain the
      # dashboard runs, so a failure here is a failure there too.
      - run: npm run build

      - name: Upload to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name tripplanner --branch main

      - name: Explain the skipped upload
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "Built successfully, but nothing was uploaded."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository"
          echo "secrets to have this workflow publish the site."

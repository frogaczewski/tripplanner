# Builds and uploads the site to Cloudflare Pages on every push to main.
#
# This exists because the dashboard's git integration stopped producing
# deployments. A workflow here does not depend on it: it builds the same
# `npm run build` output the dashboard would and uploads it with wrangler.
#
# It needs two repository secrets (Settings → Secrets and variables → Actions):
#
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   the account id from any dashboard URL
#
# Without them the job FAILS. It used to build, skip the upload and still report
# success, which is how the Taurus commits sat on main looking deployed while
# nothing had been published — a deploy workflow that cannot deploy is red, not
# green, so the misconfiguration is visible on the commit instead of silent.
#
# One caveat: Cloudflare refuses direct uploads to a Pages project that is
# connected to a Git repository. If the upload step reports that, the project is
# still git-connected — which also means the integration is present but not
# firing, and the fix belongs in the dashboard rather than here.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Runs the same prebuild → gpx:stats → typecheck → vite build chain the
      # dashboard runs, so a failure here is a failure there too.
      - run: npm run build

      # Checked after the build so a broken build still reports as a broken
      # build, and before the upload so the failure names the real cause.
      - name: Require Cloudflare credentials
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Cannot deploy: missing repository secret(s):$missing"
            echo "The site was built but NOT published, so the live site is still"
            echo "serving whatever was deployed last."
            echo
            echo "Add them under Settings → Secrets and variables → Actions:"
            echo "  CLOUDFLARE_API_TOKEN   token with the 'Cloudflare Pages — Edit' permission"
            echo "  CLOUDFLARE_ACCOUNT_ID  the account id from any dashboard URL"
            exit 1
          fi

      # --commit-hash/--commit-message label the deployment in the dashboard, so
      # "is the deployed build the latest commit?" is answerable at a glance.
      - name: Upload to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name tripplanner \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"

name = "tripplanner"
compatibility_date = "2024-10-01"
pages_build_output_dir = "dist"

# Create the database once with:
#   npx wrangler d1 create tripplanner
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "tripplanner"
database_id = "05750cef-fc3a-4af8-a414-775b886b54b0"
migrations_dir = "migrations"

# Bindings are not inherited by named environments, so the preview environment
# (every non-production branch) needs its own copy pointing at the same database.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "tripplanner"
database_id = "05750cef-fc3a-4af8-a414-775b886b54b0"
migrations_dir = "migrations"

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>__LEAFLET_CSS__</style>
<style>
  :root{
    color-scheme: dark;
    --surface-0:#0f0f0e; --surface-1:#1a1a19; --surface-2:#232322;
    --line:#333330;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8a897f;
    --accent:#ffd8a8;
    --ramp-0:#b56a1e; --ramp-1:#d1832b; --ramp-2:#e69d47; --ramp-3:#f4b673; --ramp-4:#ffd8a8;
    --good:#199e70; --draft:#c98500;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-0);color:var(--text-primary);
       font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
  .back{display:inline-block;font-size:13px;color:var(--text-muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--accent)}
  h1{margin:0 0 4px;font-size:30px;letter-spacing:-.02em}
  .sub{color:var(--text-secondary);margin:0 0 12px}
  .pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        padding:3px 9px;border-radius:99px;border:1px solid var(--line);vertical-align:3px;margin-left:8px}
  .pill.completed{color:var(--good);border-color:#1a5f48}
  .pill.draft,.pill.planned{color:var(--draft);border-color:#6b4a08}
  .meta{color:var(--text-muted);font-size:13px;margin:0 0 18px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .tile{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
  .tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
  .tile .v small{font-size:13px;font-weight:400;color:var(--text-secondary);margin-left:2px}
  #map{height:460px;border-radius:12px;border:1px solid var(--line);background:var(--surface-1)}
  .maprow{position:relative}
  .ramp{position:absolute;right:14px;top:14px;z-index:500;background:rgba(15,15,14,.86);
        border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--text-secondary)}
  .ramp .bar{height:8px;width:150px;border-radius:4px;margin:5px 0 3px;
       background:linear-gradient(90deg,var(--ramp-0),var(--ramp-1),var(--ramp-2),var(--ramp-3),var(--ramp-4))}
  .ramp .ends{display:flex;justify-content:space-between}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);
     margin:26px 0 10px;font-weight:600}
  #profwrap{position:relative;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:10px}
  #profile{display:block;width:100%;height:200px}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface-2);
       border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;white-space:nowrap;
       box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:10}
  #tip b{color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--text-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-1)}
  tbody tr.active{background:var(--surface-2)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:1px;
       border:1px solid rgba(0,0,0,.5)}
  .note{color:var(--text-muted);font-size:12.5px;margin-top:10px}
  .stagenote{color:var(--text-secondary);font-size:12.5px;padding-top:0!important;border-bottom:1px solid var(--line)}
  .collab{white-space:nowrap;font:600 11px ui-sans-serif;color:#ffd8a8;
          text-shadow:0 0 4px #000,0 0 4px #000,0 0 8px #000}
  .leaflet-container{background:#12120f}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface-2);color:var(--text-primary)}
  @media(max-width:640px){#map{height:340px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; all trips</a>
  <h1>__TITLE__<span class="pill __STATUS__">__STATUS__</span></h1>
  <p class="sub">__SUBTITLE__</p>
  <p class="meta" id="meta"></p>

  <div class="tiles" id="tiles"></div>

  <div class="maprow">
    <div id="map"></div>
    <div class="ramp">
      <div>Elevation</div>
      <div class="bar"></div>
      <div class="ends"><span id="rampMin"></span><span id="rampMax"></span></div>
    </div>
  </div>

  <h2>Elevation profile</h2>
  <div id="profwrap">
    <canvas id="profile"></canvas>
    <div id="tip"></div>
  </div>

  <h2>Stages</h2>
  <table>
    <thead><tr>
      <th>Day</th><th>Route</th><th>km</th><th>Gain</th><th>Moving</th><th>Avg HR</th><th>Avg W</th>
    </tr></thead>
    <tbody id="stages"></tbody>
  </table>
  <p class="note" id="geonote"></p>
</div>

<script>__LEAFLET_JS__</script>
<script>
const TRIP = __TRIP_JSON__;

/* ---------- geometry helpers ---------- */
const R = 6371.0088;
const rad = d => d * Math.PI / 180;
function haversine(a, b){
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
/* Densify a waypoint list to ~0.4 km spacing, linear elevation between waypoints. */
function densify(wps){
  const out = [];
  for (let i = 0; i < wps.length - 1; i++){
    const a = wps[i], b = wps[i+1];
    const d = haversine(a, b);
    const n = Math.max(1, Math.round(d / 0.4));
    for (let j = 0; j < n; j++){
      const t = j / n;
      out.push({lat: a.lat + (b.lat-a.lat)*t, lon: a.lon + (b.lon-a.lon)*t, ele: a.ele + (b.ele-a.ele)*t});
    }
  }
  const last = wps[wps.length-1];
  out.push({lat: last.lat, lon: last.lon, ele: last.ele});
  return out;
}

/* Build per-stage tracks with cumulative distance scaled to the recorded stage distance. */
let cum = 0;
const stages = TRIP.stages.map((st, idx) => {
  const pts = st.track && st.track.length ? st.track.map(p => ({lat:p[0], lon:p[1], ele:p[2]})) : densify(st.waypoints);
  let raw = 0;
  for (let i = 1; i < pts.length; i++) raw += haversine(pts[i-1], pts[i]);
  const scale = (st.distance_km && raw > 0) ? st.distance_km / raw : 1;
  let d = 0;
  pts[0].km = cum;
  for (let i = 1; i < pts.length; i++){
    d += haversine(pts[i-1], pts[i]) * scale;
    pts[i].km = cum + d;
  }
  cum += (st.distance_km || d);
  return Object.assign({}, st, {pts, idx, startKm: pts[0].km, endKm: pts[pts.length-1].km});
});
const allPts = stages.flatMap(s => s.pts);
const totalKm = TRIP.totals.distance_km || stages.reduce((a,s)=>a+(s.distance_km||0),0);
const totalGain = TRIP.totals.elevation_m || stages.reduce((a,s)=>a+(s.elevation_m||0),0);
const eleMin = Math.min(...allPts.map(p=>p.ele)), eleMax = Math.max(...allPts.map(p=>p.ele));

/* ---------- single-hue sequential ramp (low = dim, high = bright) ---------- */
const RAMP = ['#b56a1e','#d1832b','#e69d47','#f4b673','#ffd8a8'].map(h =>
  [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
function eleColor(e){
  const t = eleMax === eleMin ? 0 : (e - eleMin) / (eleMax - eleMin);
  const x = Math.min(0.9999, Math.max(0, t)) * (RAMP.length - 1);
  const i = Math.floor(x), f = x - i;
  const a = RAMP[i], b = RAMP[i+1] || RAMP[i];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}

/* ---------- header ---------- */
const fmtDate = s => s ? new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}) : null;
const metaBits = [];
if (TRIP.dates && TRIP.dates.start) metaBits.push(fmtDate(TRIP.dates.start) + (TRIP.dates.end ? ' – ' + fmtDate(TRIP.dates.end) : ''));
else metaBits.push('dates not set');
if (TRIP.country) metaBits.push(TRIP.country.join(', '));
if (TRIP.bike) metaBits.push(TRIP.bike);
document.getElementById('meta').textContent = metaBits.join('  ·  ');
document.getElementById('geonote').textContent = TRIP.geometry_note || '';
document.getElementById('rampMin').textContent = Math.round(eleMin) + ' m';
document.getElementById('rampMax').textContent = Math.round(eleMax) + ' m';

const tiles = [
  ['Distance', Math.round(totalKm).toLocaleString(), 'km'],
  ['Elevation', Math.round(totalGain).toLocaleString(), 'm'],
  ['Stages', String(stages.length), stages.length === 1 ? 'day' : 'days'],
  ['High point', Math.round(eleMax).toLocaleString(), 'm']
];
if (TRIP.totals.moving_time) tiles.push(['Moving time', TRIP.totals.moving_time, '']);
if (TRIP.totals.avg_power_w) tiles.push(['Avg power', String(TRIP.totals.avg_power_w), 'W']);
document.getElementById('tiles').innerHTML = tiles.map(t =>
  `<div class="tile"><div class="k">${t[0]}</div><div class="v">${t[1]}${t[2]?`<small>${t[2]}</small>`:''}</div></div>`).join('');

/* ---------- map ---------- */
const map = L.map('map', {scrollWheelZoom:false, zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19, subdomains:'abcd'
}).addTo(map);

const layers = [];
stages.forEach(st => {
  const casing = L.polyline(st.pts.map(p=>[p.lat,p.lon]), {color:'#0d0d0c', weight:7, opacity:.85}).addTo(map);
  const segs = [];
  for (let i = 1; i < st.pts.length; i++){
    const mid = (st.pts[i-1].ele + st.pts[i].ele)/2;
    segs.push(L.polyline([[st.pts[i-1].lat,st.pts[i-1].lon],[st.pts[i].lat,st.pts[i].lon]],
      {color: eleColor(mid), weight:3.5, opacity:1, lineCap:'round'}).addTo(map));
  }
  layers.push({casing, segs, bounds: L.latLngBounds(st.pts.map(p=>[p.lat,p.lon]))});
});

function marker(w, html, cls){
  return L.marker([w.lat,w.lon], {icon: L.divIcon({className:'', html, iconSize:[0,0]})})
    .bindPopup(`<b>${w.name}</b><br>${Math.round(w.ele)} m`);
}
const colLabels = [], dayAnchors = [];
const seenCols = new Set();
stages.forEach(st => {
  st.waypoints && st.waypoints.forEach(w => {
    if ((w.type === 'col' || w.type === 'highpoint') && !seenCols.has(w.name)){
      seenCols.add(w.name);
      const m = marker(w, `<div style="transform:translate(-6px,-6px);width:12px;height:12px;background:#ffd8a8;
        border:2px solid #0d0d0c;rotate:45deg;border-radius:2px"></div>
        <div class="collab" style="transform:translate(10px,-18px)">${w.name} ${Math.round(w.ele)}</div>`).addTo(map);
      colLabels.push({m, w});
    }
  });
  const s = st.waypoints ? st.waypoints[0] : st.pts[0];
  dayAnchors.push({lat: s.lat, lon: s.lon});
  marker({name: st.from, lat: s.lat, lon: s.lon, ele: s.ele},
    `<div style="transform:translate(-9px,-9px);width:18px;height:18px;border-radius:50%;background:#0d0d0c;
      border:2px solid #ffd8a8;color:#ffd8a8;font:600 11px/15px ui-sans-serif;text-align:center">${st.day||st.idx+1}</div>`).addTo(map);
});
const last = stages[stages.length-1];
const lw = last.waypoints ? last.waypoints[last.waypoints.length-1] : last.pts[last.pts.length-1];
dayAnchors.push({lat: lw.lat, lon: lw.lon});
marker({name: last.to, lat: lw.lat, lon: lw.lon, ele: lw.ele},
  `<div style="transform:translate(-8px,-8px);width:16px;height:16px;border-radius:50%;background:#ffd8a8;
    border:2px solid #0d0d0c"></div>`).addTo(map);

const fullBounds = L.latLngBounds(allPts.map(p=>[p.lat,p.lon]));
map.fitBounds(fullBounds, {padding:[28,28]});

const hoverMarker = L.circleMarker([0,0], {radius:6, color:'#0d0d0c', weight:2, fillColor:'#ffffff',
  fillOpacity:1, interactive:false});

/* Hide col labels that would collide; highest summits win. */
function declutter(){
  const boxes = [];
  /* Day and finish markers are fixed furniture — labels give way to them. */
  dayAnchors.forEach(a => {
    const pt = map.latLngToContainerPoint([a.lat, a.lon]);
    boxes.push({x1: pt.x - 12, y1: pt.y - 12, x2: pt.x + 12, y2: pt.y + 12});
  });
  colLabels.slice().sort((a,b) => b.w.ele - a.w.ele).forEach(({m, w}) => {
    const el = m.getElement() && m.getElement().querySelector('.collab');
    if (!el) return;
    const pt = map.latLngToContainerPoint([w.lat, w.lon]);
    const width = w.name.length * 6 + 34, height = 14;
    const box = {x1: pt.x + 8, y1: pt.y - 20, x2: pt.x + 8 + width, y2: pt.y - 20 + height};
    const size = map.getSize();
    const hit = boxes.some(b => !(box.x2 < b.x1 || box.x1 > b.x2 || box.y2 < b.y1 || box.y1 > b.y2))
             || box.x2 > size.x || box.y1 < 0;
    el.style.display = hit ? 'none' : 'block';
    if (!hit) boxes.push(box);
  });
}
map.on('zoomend moveend resize', declutter);
setTimeout(declutter, 0);

/* ---------- elevation profile ---------- */
const cv = document.getElementById('profile'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
let geom = null;
function drawProfile(){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 200;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const padL = 44, padR = 10, padT = 12, padB = 24;
  const iw = w - padL - padR, ih = h - padT - padB;
  const yTop = Math.ceil(eleMax/250)*250, yBot = Math.max(0, Math.floor(eleMin/250)*250);
  const X = km => padL + (km/totalKm) * iw;
  const Y = e => padT + ih - ((e - yBot)/(yTop - yBot)) * ih;
  geom = {X, Y, padL, padT, ih, iw, w, h};

  ctx.strokeStyle = '#2a2a28'; ctx.lineWidth = 1; ctx.fillStyle = '#8a897f';
  ctx.font = '11px ui-sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const step = (yTop - yBot) > 2000 ? 500 : 250;
  for (let e = yBot; e <= yTop; e += step){
    const y = Y(e);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(e + ' m', padL - 7, y);
  }
  /* stage boundaries */
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  stages.forEach(st => {
    const x = X(st.startKm);
    ctx.strokeStyle = '#3a3a36'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ih); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#8a897f';
    if (st.idx === 0 || (X(st.endKm) - x) > 34) ctx.fillText('D' + (st.day||st.idx+1), x + (X(st.endKm)-x)/2, padT + ih + 6);
  });
  /* area fill, coloured by elevation */
  const grad = ctx.createLinearGradient(0, Y(eleMax), 0, Y(yBot));
  grad.addColorStop(0, 'rgba(255,216,168,.55)');
  grad.addColorStop(1, 'rgba(181,106,30,.10)');
  ctx.beginPath(); ctx.moveTo(X(0), Y(allPts[0].ele));
  allPts.forEach(p => ctx.lineTo(X(p.km), Y(p.ele)));
  ctx.lineTo(X(allPts[allPts.length-1].km), padT + ih);
  ctx.lineTo(X(0), padT + ih); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  /* line */
  ctx.beginPath(); ctx.moveTo(X(allPts[0].km), Y(allPts[0].ele));
  allPts.forEach(p => ctx.lineTo(X(p.km), Y(p.ele)));
  ctx.strokeStyle = '#ffd8a8'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  /* km axis */
  ctx.fillStyle = '#8a897f'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.textAlign = 'left';  ctx.fillText('0 km', X(0), padT + ih + 6);
  ctx.textAlign = 'right'; ctx.fillText(Math.round(totalKm) + ' km', X(totalKm), padT + ih + 6);
}
drawProfile();
addEventListener('resize', drawProfile);

function pointAtKm(km){
  let lo = 0, hi = allPts.length - 1;
  while (lo < hi){ const mid = (lo+hi)>>1; if (allPts[mid].km < km) lo = mid+1; else hi = mid; }
  return allPts[lo];
}
cv.addEventListener('mousemove', ev => {
  if (!geom) return;
  const r = cv.getBoundingClientRect();
  const x = ev.clientX - r.left;
  const km = Math.min(totalKm, Math.max(0, (x - geom.padL)/geom.iw * totalKm));
  const p = pointAtKm(km);
  const st = stages.find(s => km >= s.startKm && km <= s.endKm) || stages[stages.length-1];
  drawProfile();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(geom.X(p.km), geom.padT); ctx.lineTo(geom.X(p.km), geom.padT+geom.ih); ctx.stroke();
  ctx.beginPath(); ctx.arc(geom.X(p.km), geom.Y(p.ele), 4, 0, 7); ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#0d0d0c'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
  tip.style.opacity = 1;
  tip.innerHTML = `<b>${Math.round(p.ele)} m</b> · ${p.km.toFixed(1)} km<br>
    <span style="color:var(--text-secondary)">Day ${st.day||st.idx+1} — ${st.from} → ${st.to}</span>`;
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(geom.w - tw - 6, Math.max(6, geom.X(p.km) - tw/2)) + 'px';
  tip.style.top = Math.max(4, geom.Y(p.ele) - 52) + 'px';
  hoverMarker.setLatLng([p.lat, p.lon]).addTo(map);
});
cv.addEventListener('mouseleave', () => { tip.style.opacity = 0; drawProfile(); map.removeLayer(hoverMarker); });

/* ---------- stage table ---------- */
const tb = document.getElementById('stages');
let active = null;
stages.forEach(st => {
  const tr = document.createElement('tr');
  const hi = Math.max(...st.pts.map(p => p.ele));
  tr.innerHTML = `<td><span class="dot" style="background:${eleColor(hi)}"></span>${st.day||st.idx+1}</td>
    <td>${st.from} → ${st.to}</td>
    <td>${st.distance_km != null ? st.distance_km.toFixed(1) : '–'}</td>
    <td>${st.elevation_m ? st.elevation_m.toLocaleString() + ' m' : '–'}</td>
    <td>${st.moving_time || '–'}</td>
    <td>${st.avg_hr || '–'}</td>
    <td>${st.avg_power_w || '–'}</td>`;
  tr.onclick = () => {
    if (active === st){ map.fitBounds(fullBounds,{padding:[28,28]}); tr.classList.remove('active'); active = null;
      layers.forEach(l => { l.segs.forEach(s=>s.setStyle({opacity:1})); l.casing.setStyle({opacity:.85}); });
      return; }
    tb.querySelectorAll('tr').forEach(r => r.classList.remove('active'));
    tr.classList.add('active'); active = st;
    map.fitBounds(layers[st.idx].bounds, {padding:[34,34]});
    layers.forEach((l,i) => { const on = i === st.idx;
      l.segs.forEach(s=>s.setStyle({opacity: on ? 1 : .22})); l.casing.setStyle({opacity: on ? .85 : .2}); });
  };
  tb.appendChild(tr);
  if (st.note){
    const nr = document.createElement('tr');
    nr.innerHTML = `<td></td><td class="stagenote" colspan="6">${st.note}</td>`;
    tb.appendChild(nr);
  }
});
</script>
</body>
</html>
